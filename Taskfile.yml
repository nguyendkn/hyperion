version: "3"

# Automation for build, cross-compile, and developer tasks. Mirrors the
# architecture doc's "biên dịch & đóng gói chéo" requirement.

vars:
  CARGO: cargo

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the whole Rust workspace (stub backend, no CUDA needed)
    cmds:
      - "{{.CARGO}} build --workspace"

  build:sm90:
    desc: Build with the Hopper SM90 backend (requires TensorRT-LLM + CUDA)
    cmds:
      - "{{.CARGO}} build -p helios-cli --no-default-features --features sm90"

  build:sm120:
    desc: Build with the Blackwell SM120 backend (requires CUDA Driver + NVRTC)
    cmds:
      - "{{.CARGO}} build -p helios-cli --no-default-features --features sm120"

  check:
    desc: Typecheck the workspace without producing artifacts
    cmds:
      - "{{.CARGO}} check --workspace --all-targets"

  check:sm120:
    desc: Type-check the SM120 backend (no CUDA toolkit needed to type-check; linking needs it)
    cmds:
      - "{{.CARGO}} check -p helios-hal --features sm120"
      - "{{.CARGO}} check -p helios-cli --features sm120"

  test:
    desc: Run Rust tests plus the manifest schema drift check
    cmds:
      - "{{.CARGO}} test --workspace"
      - task: schema:check

  schema:gen:
    desc: Regenerate specification/schema/manifest.v1.json from the Rust structs
    cmds:
      - "{{.CARGO}} run -p hyperion-specification --features schema --bin gen-schema"

  schema:check:
    desc: Fail if the committed manifest schema is stale (also runs the manifest contract tests)
    cmds:
      - "{{.CARGO}} test -p hyperion-specification --features schema"

  ignition:install:
    desc: Install the Python Ignition compiler in dev mode (with test extras)
    cmds:
      - "pip install -e \"ignition[test]\""

  ignition:test:
    desc: Run the Ignition tests (manifest schema, compilers, CLI)
    cmds:
      - "pytest ignition/tests"

  ignition:compile:
    desc: Compile a model package (usage: task ignition:compile -- --model <id> --hw <sm>)
    cmds:
      - "hyperion-compile {{.CLI_ARGS}}"
