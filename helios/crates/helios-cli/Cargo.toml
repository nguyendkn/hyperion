[package]
name = "helios-cli"
description = "Standalone executable entrypoint for the Helios runtime — loads a .hyperion package, runs HAL triage, starts the API server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "helios-cli"
path = "src/main.rs"

[dependencies]
helios-core = { workspace = true }
helios-hal = { workspace = true }
hyperion-specification = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
