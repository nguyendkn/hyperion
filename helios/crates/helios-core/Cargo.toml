[package]
name = "helios-core"
description = "Device-agnostic inference kernel: HTTP API, paged KV cache scheduler, and engine state machine. Talks to GPU only through the HAL trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
helios-hal = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tokio-stream = { workspace = true }
minijinja = { workspace = true }
minijinja-contrib = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# HuggingFace tokenizers (Rust core, Apache-2.0) — runtime prompt encode.
# 0.22 fails to compile unless one regex backend is chosen. `fancy-regex` is pure Rust (no C
# compiler, no Oniguruma build) and was checked against `onig`, the upstream default: on 36
# strings (two real tokenizers, 18 samples with emoji, CJK, RTL scripts, combining marks, CRLF,
# NBSP, code, URLs, special tokens) the token ids are identical, and every test against Hugging
# Face reference ids passes with it (see `tests/regex_backend_dump.rs` to repeat the comparison).
# 0.19.1 could not parse the current Qwen3 tokenizer.json, hence 0.22. We need only BPE encode ->
# Vec<u32>: no progress bar, no http/hf-hub.
tokenizers = { workspace = true, features = ["fancy-regex"] }

[dev-dependencies]
# Tests build manifests to ask the HAL factory for a real (stub) backend.
hyperion-specification = { workspace = true }

[lib]
name = "helios_core"
path = "src/lib.rs"
