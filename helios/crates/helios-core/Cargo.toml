[package]
name = "helios-core"
description = "Device-agnostic inference kernel: HTTP API, paged KV cache scheduler, and engine state machine. Talks to GPU only through the HAL trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
helios-hal = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# HuggingFace tokenizers (Rust core, Apache-2.0) — runtime prompt encode.
# 0.22 fails to compile unless one regex backend is chosen (`onig` or
# `fancy-regex`). `onig` (Oniguruma via `cc`) is the upstream default, so token
# ids match the reference implementation; `fancy-regex` (pure Rust) was not
# evaluated for identical output on real tokenizers. (The 0.19 `cfg` quirk that
# the old comment described no longer applies.) 0.19.1 also could not parse the
# current Qwen3 tokenizer.json, hence the bump. We need only BPE encode ->
# Vec<u32>: no progress bar, no http/hf-hub.
tokenizers = { workspace = true, features = ["onig"] }

[lib]
name = "helios_core"
path = "src/lib.rs"
