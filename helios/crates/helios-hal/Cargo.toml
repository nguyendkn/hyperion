[package]
name = "helios-hal"
description = "Hardware Abstraction Layer for Helios — trait contract for every GPU backend, feature-gated per compute capability."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Feature flags select a backend at compile time. At runtime the backend
# factory probes the actual device and may *downgrade* (run sm_90 kernels on
# sm_120) but never *upgrade*. Exactly one target backend is usually enabled —
# `--features sm120` for a Blackwell workstation, `--features sm90` for a
# Hopper cluster node, or `default` for a stub that compiles without CUDA.
[features]
default = ["stub"]
# Stub backend: compiles on any host without CUDA. Lets CI typecheck the HAL
# contract and lets `helios-core` link against the trait without a GPU.
stub = []
# Shared CUDA Driver-API core (ADR 0001): context, memory, copies, weight upload.
# The driver and cuBLAS are loaded at run time, so this builds without the CUDA
# toolkit or a GPU; a host without the libraries gets a typed error at probe time
# (still no emulation).
cuda = []
# Hopper SM90 (H100/H200): shared core + Hopper kernels (no TensorRT-LLM shim).
sm90 = ["cuda"]
# Blackwell SM120 (RTX PRO 6000 / DGX Spark): shared core + native CUDA Graph capture.
sm120 = ["cuda"]
# Enables *both* backends and picks one at runtime via the factory. Increases
# binary size; intended for distributable builds, not per-host binaries.
multi = ["sm90", "sm120"]

[dependencies]
hyperion-specification = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }

[lib]
name = "helios_hal"
path = "src/lib.rs"
