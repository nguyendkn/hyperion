# L0 only (docs/testing-layers.md): everything that needs neither a GPU nor the CUDA toolkit, on
# Linux and Windows. Hardware tests (L1 and above) stay manual on pods; they are `#[ignore]`d, so
# `cargo test` lists them and never runs them. Model fixtures are not fetched here: tests that need
# them skip visibly.
name: L0

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  l0:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: l0-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}

      # Full output of every test run is kept as an artifact (test-logs), pass or fail, so a flaky failure can be read afterwards.
      - name: Rust tests (stub backend)
        shell: bash
        run: |
          mkdir -p test-logs
          cargo test --workspace 2>&1 | tee test-logs/cargo-test-workspace.log; test "${PIPESTATUS[0]}" -eq 0

      # The CUDA backends build and link without the toolkit (the driver and cuBLAS are loaded at
      # run time), and their CUDA-free tests run; with no driver the factory falls back to the stub.
      - name: Hopper backend, CUDA-free tests
        shell: bash
        run: |
          mkdir -p test-logs
          cargo test -p helios-hal --features sm90 2>&1 | tee test-logs/cargo-test-sm90.log; test "${PIPESTATUS[0]}" -eq 0

      - name: Blackwell backend, CUDA-free tests
        run: cargo test -p helios-hal --features sm120

      - name: CLI builds with each backend
        run: |
          cargo build -p helios-cli --features sm90
          cargo build -p helios-cli --features sm120

      - name: Manifest contract and schema drift
        run: cargo test -p hyperion-specification --features schema

      - name: Committed schema equals the regenerated one
        run: |
          cargo run -p hyperion-specification --features schema --bin gen-schema
          git diff --exit-code specification/schema

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ignition tests
        shell: bash
        run: |
          mkdir -p test-logs
          python -m pip install -e "ignition[test]"
          python -m pytest ignition/tests -rA --junitxml=test-logs/pytest-junit.xml 2>&1 | tee test-logs/pytest.log; test "${PIPESTATUS[0]}" -eq 0

      - name: Keep the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: test-logs
          if-no-files-found: ignore
