[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "hyperion-ignition"
version = "0.1.0"
description = "Build-time compiler for .hyperion packages: extract weights, compile model graphs, sign and package."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["llm", "inference", "cuda", "blackwell", "hopper", "quantization", "huggingface", "model-compiler"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "jsonschema>=4.18",  # validate manifests against the Rust-generated schema
]

[project.urls]
Homepage = "https://github.com/nguyendkn/hyperion"
Repository = "https://github.com/nguyendkn/hyperion"
Issues = "https://github.com/nguyendkn/hyperion/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]  # pytest-cov: branch-coverage gate (quality-gate.md)

[project.scripts]
hyperion-compile = "hyperion_ignition.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperion_ignition"]

# Ship the schema in the wheel; editable installs read it from the repository.
[tool.hatch.build.targets.wheel.force-include]
"../specification/schema/manifest.v1.json" = "hyperion_ignition/schema/manifest.v1.json"

[tool.ruff]
line-length = 100
target-version = "py311"
