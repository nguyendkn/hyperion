[package]
name = "hyperion-specification"
description = "Versioned data contract for .hyperion model packages — back-compat guaranteed per major version."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Generate JSON Schema from the manifest structs (see `gen-schema`). Off by default
# so the runtime does not link schemars.
schema = ["dep:schemars"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
# SHA-256 for cache_identity and package hashes (owner-approved 2026-10-30, replacing a hand-written implementation).
sha2 = { workspace = true }
schemars = { workspace = true, optional = true }

[lib]
name = "hyperion_specification"
path = "src/lib.rs"

[[bin]]
name = "gen-schema"
path = "src/bin/gen-schema.rs"
required-features = ["schema"]
