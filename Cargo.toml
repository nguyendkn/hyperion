[workspace]
resolver = "2"
members = [
    "specification",
    "helios/crates/*",
]

# Central dependency & feature inheritance. Crates reference these via
# `dep.workspace = true` so versions stay consistent across the workspace.
[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/nguyendkn/hyperion"
homepage = "https://github.com/nguyendkn/hyperion"
readme = "README.md"
keywords = ["llm", "inference", "cuda", "gpu", "openai"]
categories = ["science", "web-programming::http-server"]
authors = ["Hyperion Contributors"]

[workspace.dependencies]
# Error handling & logging (shared by all Rust crates)
anyhow = { version = "1.0", features = ["backtrace"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Async runtime + HTTP server (helios-core API layer)
tokio = { version = "1.37", features = ["full"] }
# Cooperative task cancellation for the scheduler: a `CancellationToken` lets
# the CLI ask the scheduler to stop at a safe point (between CUDA calls)
# rather than `abort()`-ing the task mid-device-call (use-after-free risk on
# the device memory the scheduler is touching). Default features suffice.
tokio-util = "0.7"
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Serialization of the .hyperion manifest (versioned, binary-friendly)
bincode = "1.3"

# JSON Schema generation from the specification structs (feature-gated in
# hyperion-specification; never linked into the runtime binary).
schemars = "1"

# Cryptographic integrity of model packages (signature verification at load).
# No crate depends on these yet: reserved for the package/signing phase.
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# CUDA Driver FFI for the SM120 backend (feature-gated). cuda-driver-sys binds
# the CUDA Driver only — the graph-capture API + device probing the backend
# needs live in the driver, and going straight to it (vs. the runtime wrapper
# in cuda-sys) matches the zero-overhead posture. Hosts without CUDA must not
# enable sm120 — they build with the `stub` default instead.
cuda-driver-sys = "0.3"

# HuggingFace tokenizers (Rust core, Apache-2.0) for runtime prompt encoding.
# Used by helios-core's API+scheduler path. Apache-2.0, pure Rust, no Python.
tokenizers = { version = "0.22", default-features = false }

# Renders a model's own Jinja chat template (tokenizer_config.json) exactly as Hugging Face does,
# instead of guessing each model's prompt format in Rust.
minijinja = { version = "3", features = ["serde", "json"] }
minijinja-contrib = { version = "3", features = ["pycompat"] }

# Internal crates — pinned to the workspace version
hyperion-specification = { path = "specification", version = "0.1.0" }
helios-core = { path = "helios/crates/helios-core", version = "0.1.0" }
helios-hal = { path = "helios/crates/helios-hal", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
